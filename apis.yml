name: Sunshine Lake Pharma
description: 'Sunshine Lake Pharma (Guangdong East Sunshine Pharmaceutical Co., Ltd.,
  also known as HEC Pharm) is a Chinese pharmaceutical company established in 2003 and
  part of the Dongyangguang (HEC) Group. It engages in drug research, development, production,
  and commercialization across innovative drugs, improved formulations, generics, and
  biosimilars, focused on infections, chronic diseases, and oncology. Notable products
  include oseltamivir phosphate (influenza), sofosbuvir-based hepatitis C therapy, and
  insulin glargine (diabetes). It is a manufacturer with no public developer or API surface.
  Surfaced as a portfolio company of idg-capital and added to the API Evangelist network.'
